schema_version: 1

context:
  version: "2.0.4"

package:
  name: spiralstrip
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/f8/99/7406f666e7d8837dd46ef0d728612cb5fc2a989c60a5e3abec8d77f209ea/spiralstrip-${{ version }}.tar.gz
  sha256: 3ffc2e9ce51172b798ff9878f717ad1249f0d4a628a3a6a104b87996a38814d8

build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.23.5
    - matplotlib-base >=3.8

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - spiralstrip
        - spiralstrip_examples
      pip_check: true

about:
  homepage: https://github.com/skokg/Spiral-strip
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: Draw data as colored segments arranged along a spiral using Matplotlib.
  description: |
    Spiral Strip draws color-coded segments arranged along a spiral. Segment
    widths and lengths can vary to represent additional data. The library
    supports standalone graphics and drawing into existing Matplotlib axes,
    including subplots and subfigures, with optional labels, titles, and colorbars.
  repository: https://github.com/skokg/Spiral-strip

extra:
  recipe-maintainers:
    - skokg
